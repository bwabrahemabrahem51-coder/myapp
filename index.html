  --pri:#5B6CFF;--pri2:#7C8BFF;--hd1:#020208;--hd2:#0F1236;--gold:#6C7BFF;--gold2:#B3BDFF;--price:#9AA6FF;--ok:#4ADE9A;--dng:#FF7A86;
  --gold-grad:linear-gradient(115deg,#4F60FF,#B3BDFF 45%,#7C8BFF 70%,#4F60FF);
  --hdbg:radial-gradient(70% 140% at 100% 0,rgba(108,123,255,.38),transparent 60%),radial-gradient(60% 100% at 0 100%,rgba(79,96,255,.22),transparent 60%),linear-gradient(160deg,#0E1030,#020208);
  --ttl:#C9D0FF;--hbtn:#B3BDFF;--num:var(--gold-grad);--glow:drop-shadow(0 0 10px rgba(108,123,255,.7));--fab:linear-gradient(145deg,#8B99FF,#4F60FF);--fabc:#fff;--fabs:0 0 26px rgba(108,123,255,.65)}
header,.hero{background:var(--hdbg)}
header h1{background:none;-webkit-text-fill-color:currentColor;color:var(--ttl);filter:var(--glow)}
header button{color:var(--hbtn);border-color:color-mix(in srgb,var(--hbtn) 35%,transparent)}
.hero::after{background:linear-gradient(115deg,color-mix(in srgb,var(--gold2) 80%,transparent),transparent 50%,color-mix(in srgb,var(--gold2) 60%,transparent))}
.hero .k{color:var(--gold2)}
.hs b{background:var(--num);-webkit-background-clip:text;background-clip:text;filter:var(--glow)}
.hs>div,.hs>div+div{border-color:color-mix(in srgb,var(--gold2) 35%,transparent)}
button.b.fab{background:var(--fab);color:var(--fabc);box-shadow:var(--fabs)}
.bottom-nav button.active .ico{color:#fff}
:root[data-theme="dark"] .ico,:root[data-theme="black"] .ico{filter:drop-shadow(0 0 5px rgba(108,123,255,.8))}
:root[data-theme="dark"] .bottom-nav button.active,:root[data-theme="black"] .bottom-nav button.active{color:#fff;box-shadow:0 0 18px rgba(108,123,255,.45);border:1px solid rgba(108,123,255,.5)}
:root[data-theme="dark"] .card,:root[data-theme="black"] .card{box-shadow:0 0 0 1px rgba(108,123,255,.1),0 14px 34px rgba(0,0,0,.6)}
:root[data-theme="dark"] .offer:hover,:root[data-theme="black"] .offer:hover{box-shadow:0 0 22px rgba(108,123,255,.3)}

/* ===== SINGLE THEME: WHITE + RED / BLACK + INDIGO ===== */

:root[data-theme="black"],:root[data-theme="dark"]{--tint:#10122E}
.theme-toggle .seg{grid-template-columns:repeat(3,minmax(0,1fr))}
body{background-image:none}
:root[data-theme="black"] body{background-image:radial-gradient(60% 28% at 50% -4%,rgba(108,123,255,.2),transparent 70%)}
header{background:var(--bg);border-radius:0;box-shadow:0 1px 0 var(--bd);border-bottom:0}
header::before,.hero::before,.hero::after{display:none}
header h1{color:var(--ttl)}
header button{background:var(--tint);border:1.5px solid color-mix(in srgb,var(--pri) 55%,transparent);color:var(--pri)}
header>span{color:var(--pri)}
.ico{color:var(--pri)}
.hero{background:var(--card);color:var(--tx);border:1.5px solid color-mix(in srgb,var(--pri) 35%,var(--bd));box-shadow:var(--sh)}
.hero .k{color:var(--tx);font-weight:700}
.hs>div,.hs>div+div{background:linear-gradient(160deg,var(--pri2),var(--pri));border:0;box-shadow:0 8px 18px color-mix(in srgb,var(--pri) 30%,transparent)}
.hs>div:hover{background:linear-gradient(160deg,var(--pri2),var(--pri));filter:brightness(1.06)}
.hs b{background:none;-webkit-text-fill-color:#fff;color:#fff}
.hs span{color:#fff;opacity:.95}
.hs .ico{color:#fff}
.card,.grp{border:1.5px solid color-mix(in srgb,var(--pri) 30%,var(--bd))}
.offer::before{background:var(--pri)}
.offer .price{background:none;-webkit-text-fill-color:currentColor;color:var(--pri)}
.av{background:var(--pri);color:#fff;box-shadow:none}
.av .ico{color:#fff}
.tag.avail{color:var(--pri);border-color:color-mix(in srgb,var(--pri) 45%,transparent);background:var(--tint)}
input,textarea,select{background:var(--tint);border:1.5px solid color-mix(in srgb,var(--pri) 55%,transparent)}
.fld input,.fld select,.fld textarea{background:transparent;border:0}

.fld::after{background:var(--pri)}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 20%,transparent)}
.drop{border-color:var(--pri);background:var(--tint)}.drop .ico{color:var(--pri)}
.bottom-nav{background:var(--card);border-color:color-mix(in srgb,var(--pri) 45%,var(--bd))}

.bottom-nav button .ico{color:var(--pri)}
.bottom-nav button.active{background:linear-gradient(160deg,var(--pri2),var(--pri));color:#fff}
.bottom-nav button.active .ico{color:#fff}
button.o{color:var(--pri);border-color:var(--pri)}
button.b,a.b{border:0}
.fhead h3,.sheet h2{background:none;-webkit-text-fill-color:currentColor;color:var(--tx)}
.sheet h2 .ico,.fhead .x{color:var(--pri)}
.pin-dot{border-color:var(--pri)}.pin-dot.filled{background:var(--pri)}
.lock-screen .logo{background:var(--pri);color:#fff;box-shadow:var(--sh-2)}
.lock-screen .logo .ico{color:#fff}
button.b .ico,a.b .ico,button.b.fab .ico,.ffoot .b .ico,.th button .ico,.pin-pad .ok .ico{color:#fff}
.offer{background:var(--card)}
.bottom-nav button.active::after{background:#fff}
html{background:var(--bg)}
body{background-repeat:no-repeat;min-height:100vh}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex-shrink:0}

.sheet>button.o{justify-content:center}

/* ===== THEME: CORAL + NAVY (مطابق للصور) ===== */
:root,:root[data-theme="white"],:root[data-theme="cream"]{
  --bg:#F6F6F6;--card:#FFFFFF;--tx:#1F2D3D;--mut:#6B7480;--bd:#E4E4E7;--soft:#F0F0F2;--tint:#FDEDEA;
  --pri:#E64C3C;--pri2:#F27B6E;--onpri:#fff;--hd1:#E64C3C;--hd2:#F27B6E;
  --navy:#1F2D3D;--navy2:#2A3B4F;
  --gold:#E64C3C;--gold2:#FFD9D4;--price:#E64C3C;--ok:#2FA36B;--dng:#E64C3C;--warn:#E0A100;
  --ttl:#E64C3C;--hbtn:#1F2D3D;
  --sh:0 2px 8px rgba(31,45,61,.08);--sh-2:0 10px 30px rgba(31,45,61,.18);
  --r:20px;--r-sm:16px;
}
:root[data-theme="black"],:root[data-theme="dark"]{
  --bg:#121212;--card:#1E1E1E;--tx:#FFFFFF;--mut:#9A9A9F;--bd:#2E2E32;--soft:#1E1E1E;--tint:#1E1E1E;
  --pri:#E64C3C;--pri2:#F27B6E;--onpri:#fff;--hd1:#E64C3C;--hd2:#F27B6E;
  --navy:#1F2F40;--navy2:#2A3D52;
  --gold:#E64C3C;--gold2:#FFB3AA;--price:#F27B6E;--ok:#58D49A;--dng:#FF7B6E;--warn:#FFB400;
  --ttl:#E64C3C;--hbtn:#FFFFFF;
  --sh:none;--sh-2:0 -8px 30px rgba(0,0,0,.5);
}
html,body{background:var(--bg)}
body{background-image:none!important;font-family:"IBM Plex Sans Arabic","Readex Pro",system-ui,Tahoma,sans-serif}
:root[data-theme="black"] body,:root[data-theme="dark"] body{background-image:none!important}

/* الهيدر: شفاف بعنوان مرجاني وأزرار أيقونات بسيطة */
header{background:var(--bg)!important;border-radius:0!important;box-shadow:none!important;border:0!important;padding:calc(env(safe-area-inset-top) + 14px) 18px 10px}
header::before,header::after,.hero::before,.hero::after{display:none!important}
header h1{font:700 24px "Readex Pro","IBM Plex Sans Arabic",sans-serif!important;color:var(--ttl)!important;-webkit-text-fill-color:var(--ttl)!important;background:none!important;filter:none!important}
header>span{color:var(--ttl)}
header button{background:transparent!important;border:0!important;color:var(--hbtn)!important;box-shadow:none;width:42px;height:42px}
header button:active{background:color-mix(in srgb,var(--hbtn) 12%,transparent)!important}
header .ico,header button .ico{color:var(--hbtn)!important;stroke:currentColor;width:24px;height:24px}
.ico{filter:none!important}

/* الكروت */
.card,.grp,.stat,.money-card,.tile{background:var(--card);border:1px solid var(--bd)!important;border-radius:20px!important;box-shadow:var(--sh)!important}
:root[data-theme="black"] .card,:root[data-theme="dark"] .card,:root[data-theme="black"] .offer:hover,:root[data-theme="dark"] .offer:hover{box-shadow:none!important}
.menu .ico,.tile .ico{color:var(--pri)}
.menu{border-radius:20px!important}

/* البطاقة الرئيسية (hero) = بطاقة مرجانية متدرجة مثل بطاقة الحي */
.hero{background:linear-gradient(110deg,#E64C3C 0%,#F27B6E 100%)!important;color:#fff!important;border:0!important;border-radius:26px!important;
  box-shadow:0 10px 26px rgba(230,76,60,.28)!important}
.hero .k{color:#fff!important;font:600 15px "IBM Plex Sans Arabic",sans-serif!important;opacity:.95}
.hero .k::before{color:#fff}
.hero .big{background:none!important;-webkit-text-fill-color:#fff!important;color:#fff!important;font-family:"Readex Pro",sans-serif!important;filter:none!important}
.hs>div,.hs>div+div{background:rgba(255,255,255,.18)!important;border:0!important;box-shadow:none!important;border-radius:18px;filter:none!important}
.hs>div:hover{background:rgba(255,255,255,.26)!important;transform:none}
.hs b{-webkit-text-fill-color:#fff!important;color:#fff!important;background:none!important;filter:none!important;font-family:"Readex Pro",sans-serif!important}
.hs span{color:#fff!important}

/* بطاقات العقارات / الأحياء */
.offer{background:var(--card)!important;border-radius:20px!important}
.offer::before{background:var(--pri)!important}
.offer::after{display:none}
.offer.is-sold::before{background:var(--mut)!important}
.offer .price{background:none!important;-webkit-text-fill-color:var(--price)!important;color:var(--price)!important;font-family:"Readex Pro",sans-serif!important}
.offer b,.fhead h3,.sheet h2,.lock-screen h2,main>h2{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif!important}
.fhead h3,.sheet h2{background:none!important;-webkit-text-fill-color:var(--tx)!important;color:var(--tx)!important}
main>h2{color:var(--tx);font-size:16px}
main>h2::before{color:var(--pri)}
main>h2::after{background:linear-gradient(90deg,var(--pri),transparent)}
.av{background:linear-gradient(135deg,#E64C3C,#F27B6E)!important;color:#fff!important;box-shadow:none!important;border-radius:16px}
.av::before{display:none}
.av .ico{color:#fff!important}

/* الوسوم */
.tag{border-radius:99px}
.tag.avail{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.tag.sold{color:var(--mut)}
.tag.rent,.tag.rented{color:var(--pri2);background:color-mix(in srgb,var(--pri) 10%,transparent);border-color:color-mix(in srgb,var(--pri) 35%,transparent)}
.tag.sale{color:var(--warn)}

/* الأزرار */
button.b,a.b{background:var(--pri)!important;color:#fff!important;border:0!important;border-radius:16px!important;box-shadow:none!important}
button.b:active,a.b:active{filter:brightness(.92)}
button.b .ico,a.b .ico,.ffoot .b .ico{color:#fff!important}
button.o{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:16px}
button.o.d{color:var(--dng);border-color:var(--dng)}
.sheet>button.o:last-child{background:transparent;border:1px solid var(--bd);color:var(--tx)}

/* زر الإضافة العائم: كحلي مثل الصور */
button.b.fab{background:var(--navy)!important;color:#fff!important;border:0!important;
  width:auto;height:56px;padding:0 20px;border-radius:20px!important;
  box-shadow:0 8px 20px rgba(0,0,0,.28)!important;display:inline-flex;align-items:center;gap:10px;
  inset-inline-end:auto;inset-inline-start:18px;font:500 16px "IBM Plex Sans Arabic",sans-serif}
button.b.fab .ico{color:#fff!important;width:24px;height:24px}

/* الشريط السفلي والتبويبات */
.bottom-nav{background:var(--card)!important;border:1px solid var(--bd)!important;border-radius:26px!important;box-shadow:none!important;left:12px;right:12px}
.bottom-nav button{color:var(--mut)}
.bottom-nav button .ico{color:var(--mut)!important}
.bottom-nav button.active{background:color-mix(in srgb,var(--pri) 14%,transparent)!important;color:var(--pri)!important;box-shadow:none!important;border:0!important}
.bottom-nav button.active .ico{color:var(--pri)!important}
.bottom-nav button.active::after{background:var(--pri)!important}

/* الحقول: إطار رفيع وزوايا دائرية */
input,textarea,select{background:transparent!important;border:1px solid var(--bd)!important;border-radius:20px!important;color:var(--tx)}
input:focus,textarea:focus,select:focus{border-color:var(--pri)!important;box-shadow:none!important}
input::placeholder,textarea::placeholder{color:var(--mut)}
.grp{background:transparent!important;border:0!important;box-shadow:none!important;overflow:visible;display:grid;gap:12px}
.grp.two{grid-template-columns:1fr 1fr}
.fld,.grp .fld{background:transparent;border:1px solid var(--bd)!important;border-radius:20px;padding:10px 18px}
.grp.two .fld+.fld{border-inline-start:1px solid var(--bd)!important}
.fld::after{display:none}
.fld:focus-within{background:transparent!important;border-color:var(--pri)!important}
.fld>span:first-child,.unit em,.hint{color:var(--mut)!important}
.fld:focus-within>span:first-child{color:var(--pri)!important}
.fld input,.fld select,.fld textarea{border:0!important;border-radius:0!important;color:var(--tx)}
.drop{border:1px solid var(--bd)!important;background:transparent!important;border-radius:20px;flex-direction:column;justify-content:center;text-align:center;min-height:150px;color:var(--tx)}
.drop .ico{color:var(--tx)!important}

/* النوافذ السفلية */
.ov{background:rgba(0,0,0,.6);backdrop-filter:none}
.sheet,.sheet.form{background:var(--card)!important;border-radius:28px 28px 0 0!important}
:root[data-theme="black"] .sheet,:root[data-theme="dark"] .sheet,:root[data-theme="black"] .sheet.form,:root[data-theme="dark"] .sheet.form{background:#1C1C1C!important}
.sheet::before{background:#C9C9D0;width:44px}
.sheet h2 .ico,.fhead .x{color:var(--tx)}
.fhead .x{background:transparent}
.ffoot{background:var(--card);border-top:0}
:root[data-theme="black"] .ffoot,:root[data-theme="dark"] .ffoot{background:#1C1C1C}
.ffoot .b{border-radius:18px!important}
.ffoot .o{color:var(--tx);border:1px solid var(--bd);padding:0 18px}
.sheet>.acts button{border-radius:18px}

/* التنبيهات */
.warn-bar{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.reminder{color:var(--dng);background:color-mix(in srgb,var(--dng) 9%,transparent);border-color:color-mix(in srgb,var(--dng) 35%,transparent)}

/* الحالة الفارغة */
.empty{color:var(--tx)}
.empty .ico{color:var(--mut)!important;opacity:.7}

/* التبديل بين الأنماط */
.theme-toggle .seg{background:transparent;border:1px solid var(--bd);border-radius:16px}
.theme-toggle .seg button.on{background:var(--pri);color:#fff}
.theme-toggle .seg button.on .ico{color:#fff!important}

/* شاشة القفل */
.lock-screen{background:var(--bg)}
.lock-screen .logo{background:linear-gradient(135deg,#E64C3C,#F27B6E)!important;color:#fff;box-shadow:none!important}
.lock-screen .logo::before{display:none}
.lock-screen .logo .ico{color:#fff!important}
.pin-dot{border-color:var(--pri)}.pin-dot.filled{background:var(--pri)}
.pin-pad button{background:var(--card);border:1px solid var(--bd);color:var(--tx)}
.pin-pad .ok{background:var(--pri)!important;border-color:var(--pri)}
.pin-pad .del{color:var(--dng)}

@media(min-width:900px){
  .bottom-nav{border-radius:0!important;left:auto;right:0}
  .bottom-nav::before{background:none!important;-webkit-text-fill-color:var(--pri)!important;color:var(--pri);font-family:"Readex Pro",sans-serif}
  button.b.fab{inset-inline-start:auto;inset-inline-end:36px}
}

/* ===== LAYOUT: مطابق للصور ===== */
body{padding-bottom:calc(env(safe-area-inset-bottom) + 100px)}
header{display:flex;align-items:center;gap:4px}
header h1{flex:1;margin:0}
header.sub h1{color:var(--tx)!important;-webkit-text-fill-color:var(--tx)!important;font-size:21px}
header .hb{margin-inline-end:4px}
main{max-width:680px}
button.b.fab{inset-inline-start:auto!important;inset-inline-end:18px!important;bottom:calc(env(safe-area-inset-bottom) + 20px)!important}
button.b.fab span{font-size:16px}
.sbox{display:flex;align-items:center;gap:12px;height:62px;padding:0 18px;border:1px solid var(--bd);border-radius:22px;background:transparent}
.sbox .ico{color:var(--mut)!important;width:26px;height:26px}
.sbox input{flex:1;border:0!important;background:transparent!important;padding:0!important;font-size:17px;height:100%;border-radius:0!important}
.hlist{display:grid;gap:14px}
.hcard{display:flex;align-items:center;gap:14px;padding:22px 18px;border-radius:26px;color:#fff;cursor:pointer;
  background:linear-gradient(110deg,#E64C3C 0%,#F27B6E 100%);box-shadow:0 10px 24px rgba(230,76,60,.28);transition:transform .12s}
.hcard:active{transform:scale(.985)}
.hcard .hi{display:grid;place-items:center;width:52px;height:52px;flex-shrink:0}
.hcard .hi .ico{width:46px;height:46px;stroke-width:1.9}
.hcard .ico{color:#fff!important}
.hcard .ht{flex:1;display:grid;gap:2px;min-width:0}
.hcard .ht b{font:700 24px/1.2 "Readex Pro","IBM Plex Sans Arabic",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hcard .ht span{opacity:.88;font-size:17px}
.hcard .chev{width:26px;height:26px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--bd);margin:4px 0 0;background:var(--bg)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--mut);font:500 18px "IBM Plex Sans Arabic",sans-serif;
  padding:14px 8px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.tabs button .ico{width:28px;height:28px;color:var(--mut)!important}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.tabs button.on .ico{color:var(--pri)!important}
.empty-big{display:grid;justify-items:center;text-align:center;gap:12px;padding:90px 16px 10px}
.empty-big .ico{width:120px;height:120px;color:var(--bd)!important;stroke-width:1.6;margin-bottom:20px}
:root[data-theme="white"] .empty-big .ico{color:#D3D3D8!important}
.empty-big h3{margin:0;font:700 26px "Readex Pro","IBM Plex Sans Arabic",sans-serif}
.empty-big p{margin:0;color:var(--tx);font-size:18px}
button.b.big{height:62px;padding:0 44px;font-size:20px;border-radius:20px!important;margin-top:18px}
.empty-doc{display:grid;justify-items:center;text-align:center;gap:14px;padding:110px 10px}
.empty-doc .ico{width:96px;height:96px;color:#C9C9CE!important;stroke-width:1.6}
.empty-doc p{margin:0;font-size:20px;color:var(--tx)}
.sheet h2.hf{font-size:26px;margin:6px 0 10px}
.sheet h2.sh{font-size:22px;padding-bottom:16px;border-bottom:1px solid var(--bd);margin-bottom:0}
.sheet h2.sh .ico{width:26px;height:26px;color:var(--tx)}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.acts2 button{justify-content:center;height:56px;font-size:18px;border-radius:18px!important}
.opts{display:grid}
.opt{display:flex;align-items:center;width:100%;background:none;border:0;color:var(--tx);font:500 20px "IBM Plex Sans Arabic",sans-serif;padding:20px 6px;cursor:pointer;text-align:start}
.opt i{margin-inline-start:auto;width:28px;height:28px;border-radius:50%;border:2.5px solid #CFCFD6;flex-shrink:0}
.opt.on i{border-color:var(--pri);background:var(--pri);box-shadow:inset 0 0 0 5px var(--card)}
:root[data-theme="black"] .opt.on i{box-shadow:inset 0 0 0 5px #1C1C1C}
/* نموذج العقار بصفحة كاملة */
.ov:has(.sheet.pageform){align-items:stretch;padding:0;background:var(--bg);backdrop-filter:none}

/* ===== سلاسة إضافية (Smooth Pro) ===== */
:root{--ease:cubic-bezier(.22,.8,.24,1);--ease-spring:cubic-bezier(.2,.9,.25,1.12)}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
header,.bottom-nav,button.b.fab,.sheet,main{backface-visibility:hidden;-webkit-backface-visibility:hidden}
header{will-change:padding,box-shadow}
.bottom-nav button{transition:background .25s var(--ease),color .25s var(--ease),transform .15s var(--ease)}
.bottom-nav button:active{transform:scale(.92)}
.bottom-nav button svg{transition:transform .3s var(--ease-spring)}
.bottom-nav button.active svg{transform:translateY(-1px) scale(1.12)}
.card{transition:transform .18s var(--ease),box-shadow .25s var(--ease),background .25s,border-color .25s}
@media(hover:hover){.tap:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}}
.tap:active{transform:scale(.982);transition-duration:.08s}
button,.tag,.opt,.sw,.sw i,input,textarea,select{transition-timing-function:var(--ease)}
input,textarea,select{transition:border-color .2s,background .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
img{transition:opacity .35s var(--ease)}
img.pre{opacity:0}
.ov{animation-duration:.22s;animation-timing-function:var(--ease)}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;will-change:transform}
.fbody,.opts,.thumbs{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.thumbs{scroll-snap-type:x proximity}
.thumbs>*{scroll-snap-align:start}
main.in-l,main.in-r{will-change:transform,opacity;animation-duration:.3s;animation-timing-function:var(--ease)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* ===== إصلاح الرجفة + التكيّف التلقائي مع حجم الشاشة ===== */

<script>
const KEY='daftar.aqarati.v1', PIN_KEY='daftar.pin', THEME_KEY='daftar.theme', FAIL_KEY='daftar.pinfail';
const blank = () => ({ n: 1, hoods: [], props: [], lastBackup: 0, del: {} });
const genUid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const markDel = u => { if (!db.del) db.del = {}; db.del[u] = Date.now(); };
let db = blank(), persisted = false, unlocked = false, lastHash = null;
let F = { q: '', hood: 0, status: '', min: '', max: '', sort: 'new' };

/* ===== الثيم ===== */
function applyTheme() {
  let saved = localStorage.getItem(THEME_KEY) || 'auto';
  if (saved === 'light') saved = 'white';
  if (saved === 'dark') saved = 'black';
  if (saved === 'cream') saved = 'white';
  if (saved !== (localStorage.getItem(THEME_KEY) || 'auto')) localStorage.setItem(THEME_KEY, saved);
  const root = document.documentElement;
  const mode = saved === 'auto'
    ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'black' : 'white')
    : (['black', 'white'].includes(saved) ? saved : 'white');
  root.setAttribute('data-theme', mode);
  root.style.colorScheme = mode === 'black' ? 'dark' : 'light';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = mode === 'black' ? '#121212' : '#F6F6F6';
}
function setTheme(mode) {
  if (!['black', 'white', 'auto'].includes(mode)) mode = 'white';
  localStorage.setItem(THEME_KEY, mode); vt(() => { applyTheme(); render(); });
}
if (window.matchMedia) {
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  const f = () => { if ((localStorage.getItem(THEME_KEY) || 'auto') === 'auto') applyTheme(); };
  if (media.addEventListener) media.addEventListener('change', f); else if (media.addListener) media.addListener(f);
}
applyTheme();
/* ===== التخزين: IndexedDB + localStorage ===== */
const idb = () => new Promise((res, rej) => {
  const r = indexedDB.open('daftar-aqarati', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const idbGet = async k => { const d = await idb(); return new Promise((res, rej) => {
  const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
const idbSet = async (k, v) => { const d = await idb(); return new Promise((res, rej) => {
  const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); };

let saveQueue = Promise.resolve();
function save() {
  db.ts = Math.max(Date.now(), (Number(db.ts) || 0) + 1);
  let okLS = true;
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { okLS = false; try { localStorage.removeItem(KEY); } catch (_) {} }
  const snapshot = db;
  saveQueue = saveQueue.then(() => idbSet('db', snapshot)).catch(() => {
    if (!okLS) alert('تعذّر الحفظ. صدّر نسخة احتياطية فوراً إن أمكن.');
  });
  scheduleSync();
  return saveQueue;
}

/* ===== تنظيف البيانات ===== */
function sanitize(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.hoods) || !Array.isArray(d.props)) return null;
  const ok = x => Number.isSafeInteger(Number(x)) && Number(x) > 0;
  const seen = new Set(), seenP = new Set();
  const hoods = d.hoods.filter(h => h && ok(h.id) && !seen.has(Number(h.id)) && seen.add(Number(h.id))).map(h => ({ id: Number(h.id), uid: String(h.uid ?? ''), ts: Number(h.ts) || 0, name: String(h.name ?? '') }));
  const props = d.props.filter(p => p && ok(p.id) && !seenP.has(Number(p.id)) && seenP.add(Number(p.id)) && seen.has(Number(p.hood)) && ['AVAILABLE','SOLD'].includes(p.status)).map(p => ({
    id: Number(p.id), uid: String(p.uid ?? ''), ts: Number(p.ts) || 0, hood: Number(p.hood), status: p.status, plot: String(p.plot ?? ''),
    size: Math.max(0, Number(p.size) || 0), price: Math.max(0, Number(p.price) || 0),
    owner: String(p.owner ?? ''), phone: String(p.phone ?? ''), notes: String(p.notes ?? '')
  }));
  // معرّف ثابت لكل عنصر. البيانات القديمة بلا معرّف تأخذ معرّفاً من اسمها حتى تتطابق بين الجهازين عند الدمج.
  const uniq = (base, used) => { let u = base, k = 1; while (used.has(u)) u = base + '#' + (++k); used.add(u); return u; };
  const usedH = new Set(), usedP = new Set();
  hoods.forEach(h => { if (h.uid && !usedH.has(h.uid)) usedH.add(h.uid); else h.uid = ''; });
  hoods.forEach(h => { if (!h.uid) h.uid = uniq('h:' + h.name, usedH); });
  const hn = id => (hoods.find(h => h.id === id) || {}).name || '';
  props.forEach(p => { if (p.uid && !usedP.has(p.uid)) usedP.add(p.uid); else p.uid = ''; });
  props.forEach(p => { if (!p.uid) p.uid = uniq('p:' + hn(p.hood) + '|' + p.plot, usedP); });
  const del = {};
  if (d.del && typeof d.del === 'object' && !Array.isArray(d.del)) for (const [k, v] of Object.entries(d.del)) if (Number(v) > 0) del[k] = Number(v);
  const maxId = Math.max(0, ...hoods.map(h => h.id), ...props.map(p => p.id));
  return { n: Math.max(Number(d.n) || 1, maxId + 1), hoods, props, del, lastBackup: Number(d.lastBackup) || 0, ts: Number(d.ts) || 0 };
}

/* ===== دمج نسخة واردة مع البيانات الحالية ===== */
function mergeData(cur, inc) {
  const st = { add: 0, upd: 0, rem: 0 };
  const del = Object.assign({}, cur.del);
  for (const u in inc.del) if (!(del[u] >= inc.del[u])) del[u] = inc.del[u];
  const dead = (u, ts) => del[u] !== undefined && del[u] >= ts;
  // طبّق الحذف الوارد على البيانات الحالية
  const p0 = cur.props.length;
  cur.props = cur.props.filter(p => !dead(p.uid, p.ts));
  st.rem += p0 - cur.props.length;
  const h0 = cur.hoods.length;
  cur.hoods = cur.hoods.filter(h => !(dead(h.uid, h.ts) && !cur.props.some(p => p.hood === h.id)));
  st.rem += h0 - cur.hoods.length;
  // الأحياء: بالمعرّف أولاً ثم بالاسم
  const hm = {};
  const ensureHood = h => {
    let m = cur.hoods.find(x => x.uid === h.uid) || cur.hoods.find(x => x.name === h.name);
    if (!m) { m = { id: cur.n++, uid: h.uid, ts: h.ts, name: h.name }; cur.hoods.push(m); delete del[h.uid]; st.add++; }
    else if (m.uid === h.uid && h.ts > m.ts && h.name !== m.name && !cur.hoods.some(x => x !== m && x.name === h.name)) { m.name = h.name; m.ts = h.ts; st.upd++; }
    hm[h.id] = m.id; return m;
  };
  for (const h of inc.hoods) if (!dead(h.uid, h.ts)) ensureHood(h);
  // العقارات: الجديد يُضاف، والأحدث تعديلاً يفوز، وعند التساوي تبقى النسخة الحالية
  for (const p of inc.props) {
    if (dead(p.uid, p.ts)) continue;
    const ih = inc.hoods.find(x => x.id === p.hood); if (!ih) continue;
    if (hm[ih.id] === undefined) ensureHood(ih);
    const lp = cur.props.find(x => x.uid === p.uid);
    if (!lp) { cur.props.push({ ...p, id: cur.n++, hood: hm[ih.id] }); st.add++; }
    else if (p.ts > lp.ts) { Object.assign(lp, p, { id: lp.id, hood: hm[ih.id] }); st.upd++; }
  }
  cur.del = del;
  return st;
}
async function init() {
  let a = null, b = null;
  try { a = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  try { b = await idbGet('db'); } catch (e) {}
  const sa = sanitize(a), sb = sanitize(b);
  const pick = sa && sb ? ((sa.ts || 0) > (sb.ts || 0) ? sa : sb) : sa || sb || null;
  if (pick) { db = Object.assign(blank(), pick); save(); }
  try { persisted = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; } catch (e) {}
  render();
}

/* ===== أدوات ===== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });

const STATUS = { AVAILABLE: 'متاح', SOLD: 'مباع' };
const $ = id => document.getElementById(id);
const val = id => $(id).value.trim();
const prop = id => db.props.find(p => p.id === id);
const hood = id => db.hoods.find(h => h.id === id);
const hoodName = id => (hood(id) || {}).name || '—';
const ptitle = p => p.plot ? 'قطعة ' + p.plot : 'عقار';
const priceTxt = p => p.price ? money(p.price) + ' د.ع' : 'السعر غير محدد';
const sizeTxt = p => p.size ? money(p.size) + ' م²' : '';
const telHref = s => 'tel:' + String(s).replace(/[^\d+]/g, '');

const ICO = {

  plus: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  back2: '<svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',

/* ===== التنقل ===== */
function go(h) { location.hash = h; }
window.addEventListener('hashchange', render);

function page(title, body, fab, back, showNav, opts) {
  opts = opts || {};
  const lead = back ? `<button class="hb" onclick="goUp()" aria-label="رجوع">${ICO.fwd}</button>` : '';
  const fl = fab ? (String(fab).indexOf('hoodForm') === 0 ? 'إضافة حي' : 'إضافة عقار') : '';
  const hdrHTML = `${lead}<h1>${esc(title)}</h1>${opts.acts || ''}`;
  const fabHTML = fab ? `<button class="b fab" onclick="${fab}" aria-label="${fl}">${ICO.plus}<span>${fl}</span></button>` : '';
  const app = $('app');
  const h = app.querySelector(':scope > header'), m = app.querySelector(':scope > main');
  /* الهيكل موجود: نحدّث الأجزاء المتغيرة فقط بدل إعادة بناء كل شيء (يمنع الرجفة) */
  if (h && m && !app.querySelector('.lock-screen')) {
    h.className = back ? 'sub' : 'top';
    if (h.innerHTML !== hdrHTML) h.innerHTML = hdrHTML;
    app.querySelectorAll(':scope > .tabs').forEach(t => t.remove());
    const nm = document.createElement('main'); nm.innerHTML = body;
    m.replaceWith(nm);
    if (opts.tabs) { const t = document.createElement('div'); t.innerHTML = opts.tabs; while (t.firstChild) nm.before(t.firstChild); }
    const f = app.querySelector(':scope > .fab');
    if (!fab) { if (f) f.remove(); }
    else if (!f) app.insertAdjacentHTML('beforeend', fabHTML);
    else if (f.getAttribute('onclick') !== fab) { f.setAttribute('onclick', fab); f.setAttribute('aria-label', fl); f.innerHTML = `${ICO.plus}<span>${fl}</span>`; }
    return;
  }
  app.innerHTML = `<header class="${back ? 'sub' : 'top'}">${hdrHTML}</header>${opts.tabs || ''}<main>${body}</main>${fabHTML}`;
}
function goUp() { backNav = true; location.hash = ''; }
function toggleTheme() {
  const cur = localStorage.getItem(THEME_KEY) || 'auto';
  setTheme(document.documentElement.getAttribute('data-theme') === 'black' ? 'white' : 'black');
}

const scrollPos = {};
let backNav = false;
let lastY = 0, tick = false, sc = false, down = false;
addEventListener('scroll', () => {
  if (tick) return; tick = true;
  requestAnimationFrame(() => {
    tick = false;
    const y = window.scrollY; scrollPos[location.hash] = y;
    const a = y > 12, moved = Math.abs(y - lastY) > 6, d = moved ? (y > lastY && y > 120) : down;
    if (a !== sc) { sc = a; document.body.classList.toggle('sc', a); }
    if (d !== down) { down = d; document.body.classList.toggle('down', d); }
    if (moved) lastY = y;
  });
}, { passive: true });
function goBack() { backNav = true; history.back(); }
let lastWorth = 0, swipeIn = '';
const tabIdx = h => ({ '': 0, hoods: 1, hood: 1, all: 2, settings: 3 })[h.slice(1).split('/')[0]] ?? 0;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const vt = (fn, dir) => {
  if (!document.startViewTransition || reduced) { fn(); return false; }
  document.documentElement.dataset.dir = dir || 'fade';
  document.startViewTransition(fn); return true;
};
function countUp() {
  const el = document.getElementById('wv'); if (!el) return;
  const to = Number(el.dataset.v) || 0, from = lastWorth; lastWorth = to;
  if (reduced || from === to) return;
  const t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / 650), e = 1 - Math.pow(1 - k, 3);
    el.textContent = money(Math.round(from + (to - from) * e));
    if (k < 1 && el.isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function render() {
  const nav = location.hash !== lastHash, back = backNav;
  const y = nav ? (back ? (scrollPos[location.hash] || 0) : 0) : window.scrollY;
  const jump = yy => window.scrollTo({ top: yy, left: 0, behavior: 'instant' });
  const run = () => { render0(); jump(y); countUp(); };
  let used = false;
  if (nav) { down = false; document.body.classList.remove('down'); }
  if (swipeIn) { run(); const m = document.querySelector('main'); if (m) m.classList.add(swipeIn); used = true; }
  else if (nav && lastHash !== null) { const cls = back || tabIdx(location.hash) < tabIdx(lastHash) ? 'in-r' : 'in-l'; run(); const m = document.querySelector('main'); if (m) m.classList.add(cls); used = true; }
  else run();
  swipeIn = '';
  if (nav) { backNav = false; if (!used) { const m = document.querySelector('main'); if (m) m.classList.add('enter'); } }
}
function bottomNav() {
  const cur = location.hash.slice(1).split('/')[0] || 'home';
  const item = (id, label, icon, on) =>
    `<button class="${on ? 'active' : ''}" onclick="go('${id === 'home' ? '' : id}')" aria-label="${label}">${icon}<span>${label}</span></button>`;
  return `<nav class="bottom-nav">${item('home', 'الرئيسية', ICO.home, cur === 'home')}${item('hoods', 'الأحياء', ICO.folder, cur === 'hoods' || cur === 'hood')}${item('all', 'العقارات', ICO.list, cur === 'all')}${item('settings', 'الإعدادات', ICO.settings, cur === 'settings')}</nav>`;
}
function render0() {
  const [r, a] = location.hash.slice(1).split('/').map(v => { try { return decodeURIComponent(v); } catch (_) { return v; } });
  closeModal();
  const hashChanged = location.hash !== lastHash;
  lastHash = location.hash;
  if (hashChanged && r === 'all') F = { q: '', hood: 0, status: ['AVAILABLE','SOLD'].includes(a) ? a : '', min: '', max: '', sort: 'new' };
  if (hasPin() && !unlocked) { lockView(); return; }
  if (recov) { recov = false; setTimeout(recoveryForm, 60); }
  if (r === 'hoods') return hoodsView();
  if (r === 'hood') return hoodView(Number(a));
  if (r === 'all') return allView();
  if (r === 'settings') return settingsView();
  homeView();
}

/* ===== القفل ===== */
function hasPin() { return !!localStorage.getItem(PIN_KEY); }
function getPin() { return localStorage.getItem(PIN_KEY); }
function setPin(p) { localStorage.setItem(PIN_KEY, p); }
function delPin() { localStorage.removeItem(PIN_KEY); unlocked = true; }

let pinBuf = '';
function lockView() {
  $('app').innerHTML = `
    <div class="lock-screen">
      <div class="logo">${ICO.lock}</div>
      <h2>دفتر عقاراتي</h2>
      <p>أدخل الرقم السري</p>
      <div class="pinmsg" id="pinmsg"></div>
      <div class="pin-display" id="pindisp">${[0,1,2,3].map(i => `<div class="pin-dot" data-i="${i}"></div>`).join('')}</div>
      <div class="pin-pad" id="pinpad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button onclick="pinTap('${n}')">${n}</button>`).join('')}
        <button onclick="pinClear()" class="del" aria-label="مسح">${ICO.close}</button>
        <button onclick="pinTap('0')">0</button>
        <button onclick="pinOk()" class="ok" aria-label="فتح">${ICO.check}</button>
      </div>
    </div>`;
  pinBuf = '';
  const b = document.createElement('button');
  b.className = 'o'; b.style.cssText = 'position:fixed;top:16px;inset-inline-end:16px;z-index:60';
  b.innerHTML = (localStorage.getItem(THEME_KEY) || 'auto') === 'black' ? ICO.sun : ICO.moon;
  b.setAttribute('aria-label', 'تبديل النمط'); b.onclick = toggleTheme;
  document.querySelector('.lock-screen').appendChild(b);
  pinLockedMsg();
}
function pinState() { try { return JSON.parse(localStorage.getItem(FAIL_KEY)) || { n: 0, until: 0 }; } catch (e) { return { n: 0, until: 0 }; } }
function pinLockedMsg() {
  const s = pinState(), left = Math.ceil((s.until - Date.now()) / 1000);
  const m = $('pinmsg'); if (m) m.textContent = left > 0 ? 'محاولات كثيرة غلط. انتظر ' + left + ' ثانية.' : '';
  return left > 0;
}
function pinTap(n) {
  if (pinLockedMsg()) return;
  if (pinBuf.length >= 4) return;
  pinBuf += n; updateDots();
  if (pinBuf.length === 4) setTimeout(pinOk, 150);
}
function pinClear() { pinBuf = ''; updateDots(); }
function updateDots() { document.querySelectorAll('.pin-dot').forEach((d, i) => d.classList.toggle('filled', i < pinBuf.length)); }
function pinOk() {
  if (pinLockedMsg()) { pinBuf = ''; updateDots(); return; }
  if (pinBuf === getPin()) {
    try { localStorage.removeItem(FAIL_KEY); } catch (e) {}
    unlocked = true; pinBuf = ''; render();
  } else {
    const p = $('pindisp');
    if (p) { p.classList.add('shake'); setTimeout(() => p.classList.remove('shake'), 400); }
    const s = pinState(); s.n++;
    if (s.n >= 5) s.until = Date.now() + 30000 * Math.pow(2, Math.min(s.n - 5, 6));
    try { localStorage.setItem(FAIL_KEY, JSON.stringify(s)); } catch (e) {}
    pinLockedMsg(); pinBuf = ''; updateDots();
  }
}

/* ===== بطاقة العقار ===== */
function propCard(p) {
  return `<div class="card tap offer${p.status === 'SOLD' ? ' is-sold' : ''}" tabindex="0" onclick="details(${p.id})" onkeydown="if(event.key==='Enter')details(${p.id})">
    <div class="row"><b>${esc(ptitle(p))}</b><span class="price">${priceTxt(p)}</span></div>
    <div class="mut">${ICO.pin} ${esc(hoodName(p.hood))}${p.size ? ' • ' + sizeTxt(p) : ''}</div>
    <div><span class="tag ${p.status === 'AVAILABLE' ? 'avail' : 'sold'}">${STATUS[p.status]}</span></div>
    ${p.notes ? `<div class="mut" style="overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(p.notes)}</div>` : ''}
  </div>`;
}
function addProp() { if (!db.hoods.length) return hoodForm(0); propForm(0); }

/* ===== الرئيسية = الأحياء ===== */
let HT = 'AVAILABLE', HF = { size: 0, sort: 'new' }, hoodSeen = 0;
const SORTS = [['new', 'الأحدث أولاً'], ['low', 'السعر: من الأقل للأعلى'], ['high', 'السعر: من الأعلى للأقل'], ['size', 'المساحة: من الأكبر للأصغر']];
function homeView() {
  hoodSeen = 0;
  const days = db.lastBackup ? Math.floor((Date.now() - db.lastBackup) / 864e5) : null;
  const warn = (days === null || days > 7) && db.props.length
    ? `<div class="card tap" style="border-color:var(--warn)" tabindex="0" onclick="go('settings')">${days === null ? 'ما سويت نسخة احتياطية للبيانات بعد.' : 'آخر نسخة احتياطية قبل ' + days + ' يوم.'} اضغط للتصدير.</div>` : '';
  page('دفتر عقاراتي', `${warn}
    <div class="sbox">${ICO.search}<input id="hq" type="search" placeholder="البحث" oninput="fillHoods()"></div>
    <div id="hl" class="hlist"></div>`,
    db.hoods.length ? 'hoodForm(0)' : '', false, false,
    { acts: `<button onclick="go('all')" aria-label="كل العقارات">${ICO.list}</button><button onclick="go('settings')" aria-label="الإعدادات">${ICO.settings}</button>` });
  fillHoods();
}
function hoodsView() { homeView(); }
function fillHoods() {
  const q = ($('hq') ? $('hq').value : '').trim().toLowerCase();
  const chev = ICO.back2.replace('class="ico"', 'class="ico chev"');
  const list = db.hoods.filter(h => !q || h.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  if (!db.hoods.length) {
    $('hl').innerHTML = `<div class="empty-big">${ICO.bld}<h3>لا توجد أحياء مضافة بعد</h3><p>ابدأ بإضافة أول حي لتنظيم عقاراتك.</p><button class="b big" onclick="hoodForm(0)">إضافة حي جديد</button></div>`;
    return;
  }
  $('hl').innerHTML = list.map(h => {
    const av = db.props.filter(p => p.hood === h.id && p.status === 'AVAILABLE').length;
    return `<div class="hcard tap" tabindex="0" onclick="go('hood/${h.id}')" onkeydown="if(event.key==='Enter')go('hood/${h.id}')"><span class="hi">${ICO.bld}</span><div class="ht"><b>${esc(h.name)}</b><span>${av} عقار متاح</span></div>${chev}</div>`;
  }).join('') || `<div class="empty">لا توجد نتائج.</div>`;

function hoodView(id) {
  const h = hood(id);

    `propForm(0,${id})`, true, false,
    { acts: `<button onclick="filterSheet(${id})" aria-label="تصفية حسب المساحة">${ICO.filter}</button><button onclick="sortSheet(${id})" aria-label="الفرز">${ICO.sort}</button>`,

}
function setHT(st, id) { HT = st; hoodView(id); }
function fillHood(id) {
  let ps = db.props.filter(p => p.hood === id && p.status === HT);
  if (HF.size) ps = ps.filter(p => Number(p.size) === HF.size);
  ps.sort((a, b) => HF.sort === 'low' ? a.price - b.price : HF.sort === 'high' ? b.price - a.price : HF.sort === 'size' ? b.size - a.size : b.id - a.id);
  $('hp').innerHTML = ps.length ? ps.map(propCard).join('') : `<div class="empty-doc">${ICO.doc}<p>لا توجد عقارات تطابق خياراتك</p></div>`;
}
function sortSheet(id) {
  modal(`<h2 class="sh">${ICO.sort} الفرز حسب</h2><div class="opts">${SORTS.map(([v, t]) => `<button class="opt ${HF.sort === v ? 'on' : ''}" onclick="HF.sort='${v}';closeModal();fillHood(${id})"><span>${t}</span><i></i></button>`).join('')}</div>`);
}
function filterSheet(id) {
  const sizes = [...new Set([300, 250, 200, 150, 100, 50, ...db.props.filter(p => p.hood === id && p.size > 0).map(p => Number(p.size))])].sort((a, b) => b - a);
  modal(`<h2 class="sh">${ICO.filter} تصفية حسب المساحة</h2><div class="opts">

    ${sizes.map(n => `<button class="opt ${HF.size === n ? 'on' : ''}" onclick="HF.size=${n};closeModal();fillHood(${id})"><span>${money(n)} م²</span><i></i></button>`).join('')}</div>`);

function hoodForm(id) {
  const h = id ? hood(id) : { name: '' };
  modal(`<h2 class="hf">${id ? 'تعديل الحي' : 'إضافة حي جديد'}</h2>
    <input id="hn" value="${esc(h.name)}" placeholder="اسم الحي">
    <div class="acts2"><button class="o" onclick="closeModal()">إلغاء</button><button class="b" onclick="saveHood(${id})">${id ? 'حفظ' : 'إضافة'}</button></div>`);
  $('hn').focus();
}
function saveHood(id) {
  const name = val('hn');
  if (!name) return alert('اكتب اسم الحي.');
  if (db.hoods.some(h => h.id !== id && h.name === name)) return alert('هذا الحي موجود مسبقاً.');
  if (id) { const h = hood(id); if (!h) return alert('الحي غير موجود؛ حدّث الصفحة وحاول مجدداً.'); h.name = name; h.ts = Date.now(); }
  else db.hoods.push({ id: db.n++, uid: genUid(), ts: Date.now(), name });
  save(); closeModal(); render();
}
function delHood(id) {
  const n = db.props.filter(p => p.hood === id).length;
  if (!confirm(n ? 'حذف هذا الحي مع ' + n + ' عقار بداخله؟' : 'حذف هذا الحي؟')) return;
  const h = hood(id); if (h) markDel(h.uid);
  db.props.filter(p => p.hood === id).forEach(p => markDel(p.uid));
  db.hoods = db.hoods.filter(h => h.id !== id); db.props = db.props.filter(p => p.hood !== id);
  save(); go('hoods');
}

(() => {
  const TABS = ['', 'hoods', 'all', 'settings'];
  const root = () => location.hash.slice(1).split('/')[0];
  let sx = 0, sy = 0, st = 0, dx = 0, mode = 0, m = null;
  document.addEventListener('touchstart', e => {
    m = document.querySelector('main');
    if (!m || e.touches.length !== 1 || document.querySelector('#modal .ov') || !TABS.includes(root()) || e.target.closest('input,textarea,select,.thumbs')) { mode = 0; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = performance.now(); dx = 0; mode = 1;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (mode < 1 || mode === 3) return;
    const x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
    if (mode === 1) {
      if (Math.abs(x) < 8 && Math.abs(y) < 8) return;
      if (Math.abs(x) > Math.abs(y) * 1.2) { mode = 2; m.style.transition = 'none'; m.style.willChange = 'transform'; } else { mode = 3; return; }
    }
    const t = TABS.indexOf(root()) + (x > 0 ? 1 : -1);
    dx = t >= 0 && t < TABS.length ? x : x * .25;
    m.style.transform = 'translateX(' + dx + 'px)';
    m.style.opacity = 1 - Math.min(.45, Math.abs(dx) / 500);
  }, { passive: true });
  const end = () => {
    if (mode !== 2) { mode = 0; return; }
    mode = 0;
    const dir = dx > 0 ? 1 : -1, t = TABS.indexOf(root()) + dir, v = Math.abs(dx) / Math.max(1, performance.now() - st), el = m;
    const commit = t >= 0 && t < TABS.length && (Math.abs(dx) > 80 || (Math.abs(dx) > 35 && v > .5));
    if (commit) {
      el.style.transition = 'transform .16s ease-in, opacity .16s';
      el.style.transform = 'translateX(' + dir * 110 + '%)'; el.style.opacity = 0;
      setTimeout(() => { swipeIn = dir > 0 ? 'in-l' : 'in-r'; location.hash = TABS[t]; }, 160);
    } else {
      el.style.transition = 'transform .26s cubic-bezier(.2,.8,.2,1), opacity .26s';
      el.style.transform = ''; el.style.opacity = '';
    }
  };
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
})();

    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { if (ov) ov.style.background = 'rgba(8,14,20,' + (.55 * Math.max(.2, 1 - dy / 450)) + ')'; });
  }, { passive: true });
  modal.addEventListener('touchend', () => { y0 = null; if (ov) setTimeout(() => { if (ov) ov.style.background = ''; }, 220); });
})();

let sbUser = null, syncing = false, syncTimer = null, selfSave = false, syncAgain = false, syncMsg = '', syncErr = false;

function setSyncMsg(t, err) {
  syncMsg = t; syncErr = !!err;
  const m = $('syncmsg'); if (m) { m.textContent = t; m.className = err ? 'err' : 'ok'; }
}
const cyrb53 = s => {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
};
const errTxt = e => {
  const m = String((e && e.message) || e || '');
  if (/Invalid login/i.test(m)) return 'الإيميل أو كلمة المرور غلط.';
  if (/already registered/i.test(m)) return 'هذا الإيميل مسجّل مسبقاً. سجّل الدخول.';
  if (/Password should/i.test(m)) return 'كلمة المرور لازم 6 أحرف على الأقل.';
  if (/Email not confirmed/i.test(m)) return 'أكّد الإيميل من الرسالة اللي وصلتك أولاً.';
  if (/rate limit|too many|security purposes/i.test(m)) return 'طلبات كثيرة. انتظر دقيقة وأعد المحاولة.';
  if (/same password|different from the old/i.test(m)) return 'اختر كلمة مرور مختلفة عن القديمة.';
  if (/session missing|expired|invalid.*(token|link)/i.test(m)) return 'الرابط منتهي أو مستخدم. اطلب رابطاً جديداً.';
  if (/fetch|network/i.test(m)) return 'تعذّر الاتصال بالإنترنت.';
  return m || 'حدث خطأ غير معروف.';
};

function scheduleSync() {
  if (!sb || !sbUser || selfSave) return;
  if (syncing) { syncAgain = true; return; }
  clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(), 2500);
}

async function syncNow(manual) {
  if (!sb || !sbUser || syncing) return;
  if (!navigator.onLine) { if (manual) setSyncMsg('ما أكو اتصال بالإنترنت.', 1); return; }
  syncing = true; setSyncMsg('جارٍ المزامنة...');
  try {
    // 1) سحب كل الصفوف
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from(SB_TABLE).select('uid,kind,ts,deleted,data').order('uid').range(from, from + 999);
      if (error) throw error;
      rows.push(...data);
      if (data.length < 1000) break;
    }
    const remote = new Map(rows.map(r => [r.uid, r]));
    const inc = { hoods: [], props: [], del: {} };
    const hid = new Map(); let n = 1;
    for (const r of rows) {
      if (r.deleted) inc.del[r.uid] = Number(r.ts);
      else if (r.kind === 'hood') { const id = n++; hid.set(r.uid, id); inc.hoods.push({ id, uid: r.uid, ts: Number(r.ts), name: String((r.data || {}).name || '') }); }
    }
    for (const r of rows) {
      if (r.deleted || r.kind !== 'prop') continue;
      const d = r.data || {}, hi = hid.get(d.hoodUid); if (!hi) continue;
      const ts = Number(r.ts);
      inc.props.push({ id: n++, uid: r.uid, ts, hood: hi, status: d.status === 'SOLD' ? 'SOLD' : 'AVAILABLE', plot: String(d.plot || ''), size: Number(d.size) || 0, price: Number(d.price) || 0, owner: String(d.owner || ''), phone: String(d.phone || ''), notes: String(d.notes || '') });
    }
    // 2) دمج الوارد مع المحلي
    const st = mergeData(db, inc);

    // 3) رفع ما هو أحدث محلياً
    const out = [];
    const put = (uid, kind, ts, deleted, data) => { const r = remote.get(uid); if (!r || ts > Number(r.ts)) out.push({ user_id: sbUser.id, uid, kind, ts, deleted, data }); };
    db.hoods.forEach(h => put(h.uid, 'hood', h.ts || 0, false, { name: h.name }));
    for (const p of db.props) {
      const r = remote.get(p.uid); if (r && p.ts <= Number(r.ts)) continue;
      const h = hood(p.hood); if (!h) continue;
      out.push({ user_id: sbUser.id, uid: p.uid, kind: 'prop', ts: p.ts || 0, deleted: false, data: { hoodUid: h.uid, status: p.status, plot: p.plot, size: p.size, price: p.price, owner: p.owner, phone: p.phone, notes: p.notes } });
    }
    for (const [u, t] of Object.entries(db.del || {})) {
      if (db.props.some(p => p.uid === u) || db.hoods.some(h => h.uid === u)) continue;
      const r = remote.get(u);
      if (!r || t > Number(r.ts) || (!r.deleted && t >= Number(r.ts))) out.push({ user_id: sbUser.id, uid: u, kind: 'del', ts: t, deleted: true, data: {} });
    }
    for (let i = 0; i < out.length; i += 100) {
      const { error } = await sb.from(SB_TABLE).upsert(out.slice(i, i + 100), { onConflict: 'user_id,uid' });
      if (error) throw error;
    }

    selfSave = true; const pr = save(); selfSave = false; await pr;
    try { localStorage.setItem(SYNC_KEY, String(Date.now())); } catch (e) {}
    const changed = st.add + st.upd + st.rem;
    setSyncMsg('تمت المزامنة: ' + changed + ' تغيير نزل، ' + out.length + ' ارتفع.');
    if (changed && !document.querySelector('#modal .ov') && !document.activeElement.matches('input,textarea,select')) render();
    else if (!changed) { const l = $('synctime'); if (l) l.textContent = fmt(Date.now()); }
  } catch (e) {
    setSyncMsg('فشلت المزامنة: ' + errTxt(e), 1);
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(); }
  }
}

async function authInit() {
  if (!sb) return;

    const { data } = await sb.auth.getSession();
    sbUser = data.session ? data.session.user : null;
    sb.auth.onAuthStateChange((_e, s) => { sbUser = s ? s.user : null; if (_e === 'PASSWORD_RECOVERY') { recov = true; render(); } });
    if (sbUser) syncNow();
  } catch (e) {}
}

async function doSignUp() {
  const email = val('se'), password = $('sp').value;

  if (password.length < 6) return setSyncMsg('كلمة المرور لازم 6 أحرف على الأقل.', 1);
